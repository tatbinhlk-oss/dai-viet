<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đại Việt</title>
    <meta name="theme-color" content="#141210" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <style>
      :root { --ink: #e8dcc0; --muted: #a89c80; --bg: rgba(20, 18, 14, 0.92); --line: #7a6540; --btn: #3a2f1e; --on: #a67c2e; --bad: #e07050; }
      html, body { margin: 0; height: 100%; background: #111; overflow: hidden; font-family: system-ui, sans-serif; }
      #game { position: absolute; inset: 0; touch-action: none; }
      :root { --ui-scale: 1; }
      #ui { color: var(--ink); font-size: calc(13px * var(--ui-scale)); user-select: none; }
      .minimap { position: absolute; right: 10px; bottom: 28px; width: 160px; height: 160px; image-rendering: pixelated; border: 1px solid var(--line); background: #111; cursor: crosshair; }
      @media (max-width: 700px), (max-height: 520px) { .minimap { width: 96px; height: 96px; bottom: 26px; } }
      button { background: var(--btn); color: var(--ink); border: 1px solid var(--line); padding: 3px 9px; cursor: pointer; font: inherit; }
      button.active { background: var(--on); color: #111; }
      button:disabled { opacity: 0.45; cursor: default; }
      .filebtn { background: var(--btn); color: var(--ink); border: 1px solid var(--line); padding: 3px 9px; cursor: pointer; display: inline-block; }
      .filebtn input { display: none; }
      button.open { border-color: var(--ink); }
      .bars { position: absolute; top: 0; left: 0; right: 0; display: flex; flex-direction: column; }
      .bar { background: var(--bg); display: flex; flex-direction: column; }
      .bar.top .row { gap: 8px; align-items: center; padding: 3px 10px; }
      .bar.top .title { letter-spacing: 0.04em; }
      .bar.build { border-top: 1px solid var(--line); }
      .bar .row { display: flex; gap: 4px; flex-wrap: wrap; padding: 4px 10px; align-items: center; }
      .bar .row.sub { border-top: 1px dashed var(--line); background: rgba(40, 32, 20, 0.95); }
      .sp { flex: 1; }
      .sep { width: 1px; height: 18px; background: var(--line); }
      .bad { color: var(--bad); }
      .muted { color: var(--muted); font-size: 12px; }
      .fps { color: var(--muted); }
      .panel { position: absolute; top: 112px; width: 330px; max-height: calc(100% - 140px); overflow: auto; background: var(--bg);
               border: 1px solid var(--line); padding: 8px 12px; box-sizing: border-box; }
      .panel.info { right: 10px; }
      .panel.advisor { left: 10px; }
      .panel .head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 6px; }
      .panel p { margin: 6px 0; }
      .panel em { font-style: normal; color: #f0d890; }
      .panel .speech { font-style: italic; color: #f0e6c8; font-size: 14px; }
      table.mini { border-collapse: collapse; width: 100%; }
      table.mini td, table.mini th { padding: 2px 4px; text-align: left; border-bottom: 1px solid rgba(122, 101, 64, 0.35); }
      table.mini th { color: var(--muted); font-weight: normal; }
      table.policy button { padding: 1px 5px; font-size: 11px; margin-right: 2px; }
      .progress { height: 6px; background: #2a2418; border: 1px solid var(--line); margin: 6px 0; }
      .progress div { height: 100%; background: var(--on); }
      ul.events { margin: 6px 0; padding-left: 16px; color: var(--muted); }
      .gameover.briefing { text-align: left; max-width: 480px; top: 45%; }
      .gameover.briefing h2 { margin: 2px 0 8px; font-size: 20px; color: #f0d890; }
      .gameover.briefing .desc { font-size: 14px; line-height: 1.4; }
      table.mini tr.ok td { color: #9fd98a; }
      ul.problems { margin: 4px 0; padding-left: 16px; }
      ul.problems li.bad { color: var(--bad); }
      ul.problems li.warn { color: #f0d890; }
      button.goto { padding: 0 5px; font-size: 11px; margin-left: 2px; }
      .gameover .actions { margin-top: 10px; display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
      .overlaypick select { background: var(--btn); color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 2px 4px; }
      .overlaypick select.active { background: var(--on); color: #111; }
      .scenario select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); font: inherit; padding: 1px 4px; max-width: 170px; }
      .gameover { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); background: var(--bg); border: 2px solid var(--on); padding: 14px 20px; font-size: 15px; max-width: 420px; text-align: center; }
      .status { position: absolute; bottom: 0; left: 0; right: 0; padding: 4px 10px; color: #c8bda0; font-size: 12px; background: rgba(20, 18, 14, 0.85); pointer-events: none; }
      @media (max-width: 700px), (max-height: 520px) {
        #ui { font-size: 12px; }
        button, .filebtn { padding: 5px 8px; }
        .bar .row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding: 4px 8px; }
        .bar .row::-webkit-scrollbar { display: none; }
        .bar .row > * { flex: 0 0 auto; }
        .bar.top .fps { display: none; }
        .panel { width: calc(100% - 20px); left: 10px; right: 10px; top: auto; bottom: 28px; max-height: 45%; }
        .gameover { max-width: calc(100% - 40px); }
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
